<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Ricardo Jorge</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #111111;
        color: #eeeeee;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 1rem;
        line-height: 1.5;
      }

      main {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3rem);
        font-weight: 600;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0.5rem 0 0;
        color: #aaaaaa;
      }

      nav {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        margin-top: 1.5rem;
      }

      a {
        color: inherit;
        text-underline-offset: 0.25em;
      }

      a:hover {
        color: #ffffff;
      }

      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 5px;
      }

      .profile {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="profile" aria-labelledby="name">
        <h1 id="name">Ricardo Jorge</h1>
        <p>AI Engineer and Consultant</p>
        <nav aria-label="Profile links">
          <a href="https://cv.rj11.io/">CV</a>
          <a href="https://www.linkedin.com/in/rj11io/" aria-label="LinkedIn">LI</a>
          <a href="https://github.com/rj11io" aria-label="GitHub">GH</a>
        </nav>
      </section>
    </main>
  </body>
</html>
